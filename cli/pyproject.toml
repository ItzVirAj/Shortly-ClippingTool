[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortly"
version = "0.1.0"
description = "CLI for Shortly: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shortly" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/ItzVirAj/Shortly-ClippingTool"
Source = "https://github.com/ItzVirAj/Shortly-ClippingTool"

[project.scripts]
shortly = "shortly_cli:main"
openshorts = "shortly_cli:main"

[tool.setuptools]
py-modules = ["shortly_cli", "openshorts_cli"]
